name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

env:
  PROJECT_ID: daily-sales-report-498416
  REGION: asia-northeast1
  SERVICE: daily-sales-report
  REPO: daily-sales-report

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # CI ワークフローが成功したときのみデプロイ
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Workload Identity Federation に必要（最小権限: ジョブレベル）
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation で認証（サービスアカウントキー不要）
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/app
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --set-env-vars=NODE_ENV=production

      - name: Show deployed URL
        run: |
          echo "### :rocket: デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/app:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
