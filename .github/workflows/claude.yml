name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            このプルリクエストのコードレビューを実施してください。以下の観点で確認し、日本語でPRにコメントしてください。

            ## レビュー観点

            1. **バグ・論理エラー**: 明確なバグや意図しない動作を引き起こすロジックの誤り
            2. **セキュリティ**: 認証・認可の漏れ、入力バリデーション不足、SQLインジェクション等のOWASP Top 10
            3. **仕様準拠**: doc/配下のドキュメント（要件定義・API仕様・画面定義）への準拠
            4. **コード品質**: 過度な複雑さ、重複、不適切な命名
            5. **テスト**: 重要なビジネスロジックに対するテストの有無

            ## 出力ルール

            - 重要度が高い問題（バグ・セキュリティ）を優先して報告する
            - 軽微なスタイルの問題は省略する
            - 指摘がない場合は「問題なし」と明記する
            - インラインコメントで具体的な箇所を示す
